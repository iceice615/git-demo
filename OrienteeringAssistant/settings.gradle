pluginManagement {
    repositories {
        // 阿里云国内镜像优先，解决 google()/mavenCentral() 访问超时
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        // 百度地图 SDK 官方 Maven 仓库
        maven { url 'https://mapapi.bdimg.com/repository/maven-releases/' }
        google()
        mavenCentral()
    }
}
rootProject.name = "OrienteeringAssistant"
include ':app'
