plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.orienteeringassistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.orienteeringassistant'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'

        ndk {
            // 只保留需要的 CPU 架构，减小 APK 体积
            // arm64-v8a：现代真机；x86_64：模拟器
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // ZXing 二维码扫描库（内嵌扫码界面，无需另外安装扫码 App）
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // 百度地图 SDK（轨迹图、训练模式地图）
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Map:9.0.0'
}
